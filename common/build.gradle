plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${rootProject.archives_name}-common"
}

// 数据生成共享配置
sourceSets {
    datagen {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        java {
            srcDir 'src/datagen/java'
        }
        resources {
            srcDir 'src/datagen/resources'
        }
    }
}

configurations {
    datagenImplementation.extendsFrom implementation
    datagenRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // 跨平台兼容依赖
    compileOnly "org.slf4j:slf4j-api:2.0.9"

    // 数据生成基础依赖
    compileOnly "net.neoforged:neoforge:${rootProject.neo_version}"

    // 可选：添加通用数据生成工具
    // datagenImplementation "com.google.guava:guava:32.1.2-jre"
}

// 处理资源文件
processResources {
    inputs.property "version", project.version

    filesMatching(['*.json', '*.toml']) {
        expand(
                'version': rootProject.version,
                'mod_id': rootProject.mod_id,
                'mod_name': rootProject.mod_name,
                'mod_license': rootProject.mod_license,
                'mod_authors': rootProject.mod_authors,
                'mod_description': rootProject.mod_description,
                'minecraft_version': rootProject.minecraft_version
        )
    }

    // 包含通用配置文件
    include "${rootProject.mod_id}.mixins.json"
}

// 数据生成任务
tasks.register('buildDatagen', Jar) {
    archiveBaseName = "${rootProject.archives_name}-datagen"
    archiveClassifier = 'datagen'
    from sourceSets.datagen.output

    doLast {
        println "✅ 数据生成工具 JAR 构建完成"
    }
}

// 源码 JAR
tasks.register('commonSourcesJar', Jar) {
    dependsOn classes
    archiveBaseName = "${rootProject.archives_name}-common"
    archiveClassifier = 'sources'
    from sourceSets.main.allSource

    doLast {
        println "✅ Common 源码 JAR 构建完成"
    }
}

// 发布配置
publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = "${rootProject.archives_name}-common"
            from components.java
            artifact commonSourcesJar

            pom {
                name = "${rootProject.mod_name} (Common)"
                description = rootProject.mod_description
                url = 'https://github.com/example/multiplatform-mod'

                licenses {
                    license {
                        name = rootProject.mod_license
                    }
                }

                developers {
                    developer {
                        name = rootProject.mod_authors
                    }
                }
            }
        }
    }
}

// IDE 配置
idea {
    module {
        downloadSources = true
        downloadJavadoc = true

        // 标记数据生成源集
        sourceDirs += file('src/datagen/java')
        resourceDirs += file('src/datagen/resources')
    }
}