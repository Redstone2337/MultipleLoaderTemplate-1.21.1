plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'idea'
}

version = mod_version
group = maven_group

base {
    archivesName = "${rootProject.archives_name}-fabric"
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

// Fabric Loom 配置
loom {
    runs {
        client {
            client()
            configName = "Fabric Client"
            ideConfigGenerated(true)
            runDir = "run/client"
        }

        server {
            server()
            configName = "Fabric Server"
            ideConfigGenerated(true)
            runDir = "run/server"
            // 修复：使用 programArgs 而不是 programArgument
            programArgs '--nogui'
        }

        // 数据生成配置
        datagenClient {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir "build/datagen"
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

// 源集配置
sourceSets {
    main {
        resources {
            srcDirs += ['src/main/generated']
        }
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"

    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Common 模块
    implementation project(":common")

    // 可选：模组菜单
    // modImplementation "com.terraformersmc:modmenu:7.2.2"
}

// 资源处理
processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand(
                'version': rootProject.version,
                'mod_id': rootProject.mod_id,
                'mod_name': rootProject.mod_name,
                'mod_license': rootProject.mod_license,
                'mod_authors': rootProject.mod_authors,
                'mod_description': rootProject.mod_description,
                'minecraft_version': rootProject.minecraft_version,
                'loader_version': rootProject.fabric_loader_version
        )
    }
}

// Java 配置
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.named('compileJava') {
    dependsOn(':common:compileJava')
}

// === 数据生成任务 ===

tasks.register('generateData') {
    group = 'fabric'
    description = 'Runs the Fabric data generator'

    dependsOn 'runDatagenClient'

    doFirst {
        println "♻️ 开始 Fabric 数据生成..."
    }

    doLast {
        def generatedDir = file("src/main/generated")
        if (generatedDir.exists()) {
            def fileCount = 0
            def dirCount = 0

            generatedDir.eachFileRecurse { file ->
                if (file.isFile()) {
                    fileCount++
                } else if (file.isDirectory() && file != generatedDir) {
                    dirCount++
                }
            }

            println "✅ Fabric 数据生成完成！"
            println "📊 生成文件数: ${fileCount}"
            println "📁 生成目录数: ${dirCount}"
            println "📂 输出目录: ${generatedDir}"

            // 显示顶级目录结构
            if (generatedDir.listFiles()) {
                println "📄 生成的目录结构:"
                generatedDir.eachFile { file ->
                    if (file.isDirectory()) {
                        def subFiles = file.listFiles()?.size() ?: 0
                        println "   📁 ${file.name}/ (${subFiles} 个文件)"
                    } else {
                        println "   📄 ${file.name}"
                    }
                }
            }
        } else {
            println "⚠️ 警告: 数据生成目录不存在，可能生成失败"
        }
    }
}

tasks.register('cleanGeneratedData', Delete) {
    group = 'fabric'
    description = 'Cleans generated data files'

    delete file("src/main/generated")

    doLast {
        println "✅ 已清理 Fabric 生成的数据"
    }
}

// 清理任务
tasks.named('clean') {
    dependsOn 'cleanGeneratedData'
}

// 发布配置
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java

            pom {
                name = "${rootProject.mod_name} (Fabric)"
                description = rootProject.mod_description
            }
        }
    }
}

// IDE 配置
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
        generatedSourceDirs += file('src/main/generated')
    }
}

eclipse {
    classpath {
        file {
            whenMerged {
                def generated = new org.gradle.plugins.ide.eclipse.model.SourceFolder('src/main/generated', null)
                entries += generated
            }
        }
    }
}

// 调试信息任务
tasks.register('debugLoomConfig') {
    group = 'help'
    description = 'Debug Loom configuration'

    doLast {
        println "🔧 Loom 配置调试信息:"
        println "   Loom 版本: ${loom_version}"
        println "   Minecraft 版本: ${minecraft_version}"
        println "   Yarn 映射: ${yarn_mappings}"
        println "   Fabric Loader: ${fabric_loader_version}"
        println "   Fabric API: ${fabric_api_version}"

        // 检查运行配置
        println "   📋 运行配置:"
        loom.runs.configureEach { runConfig ->
            println "     - ${runConfig.name}:"
            println "       类型: ${runConfig.configName}"
            println "       运行目录: ${runConfig.runDir}"
            if (runConfig.hasProperty('programArgs')) {
                println "       程序参数: ${runConfig.programArgs}"
            }
            if (runConfig.hasProperty('vmArgs')) {
                println "       VM 参数: ${runConfig.vmArgs}"
            }
        }
    }
}