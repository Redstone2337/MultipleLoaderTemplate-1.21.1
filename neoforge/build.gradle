plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.115'
    id 'idea'
}

version = mod_version
group = maven_group

base {
    archivesName = "${rootProject.archives_name}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// 清理任务
tasks.register('cleanModDevCache', Delete) {
    delete 'build/moddev'
}

// NeoForge 配置
neoForge {
    version = rootProject.neo_version

    parchment {
        mappingsVersion = rootProject.parchment_mappings_version
        minecraftVersion = rootProject.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
            programArgument '--username=Dev'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
        }

        // 移除数据生成配置 - 使用 Fabric 生成的数据
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(":common")

    // Mixin
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

// 源集配置 - 包含通用生成数据（由 Fabric 生成）和 Mixin
sourceSets.main.resources.srcDir '../common/src/generated/resources'

// 复制 Common 的 Mixin 到 NeoForge 构建
tasks.register('copyCommonMixins', Copy) {
    from project(':common').file('src/main/java')
    into layout.buildDirectory.dir('generated/sources/commonMixins/java/main')
    include '**/*.java'
    exclude '**/platform/**'  // 排除平台特定代码
}

tasks.named('compileJava') {
    dependsOn 'copyCommonMixins'
}

sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/sources/commonMixins/java/main')

// 资源处理 - 处理 NeoForge 的 mods.toml 文件
processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", rootProject.mod_id
    inputs.property "mod_name", rootProject.mod_name
    inputs.property "mod_license", rootProject.mod_license
    inputs.property "mod_authors", rootProject.mod_authors
    inputs.property "mod_description", rootProject.mod_description
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "minecraft_version_range", rootProject.minecraft_version_range
    inputs.property "neo_version", rootProject.neo_version
    inputs.property "loader_version_range", rootProject.loader_version_range

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                'version': rootProject.mod_version,
                'mod_id': rootProject.mod_id,
                'mod_name': rootProject.mod_name,
                'mod_license': rootProject.mod_license,
                'mod_authors': rootProject.mod_authors,
                'mod_description': rootProject.mod_description,
                'minecraft_version': rootProject.minecraft_version,
                'minecraft_version_range': rootProject.minecraft_version_range,
                'neo_version': rootProject.neo_version,
                'loader_version_range': rootProject.loader_version_range
        )
    }

    // 排除 common 的 mixin 配置
    exclude "${rootProject.mod_id}.mixins.json"
}

// 编译配置
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    dependsOn(':common:compileJava')
}

// 清理任务
tasks.named('clean') {
    dependsOn 'cleanModDevCache'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

// IDE 配置
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
        generatedSourceDirs += file('../common/src/generated/resources')
    }
}

// 信息任务
tasks.register('dataGenInfo') {
    group = 'help'
    description = 'Display data generation information'

    doLast {
        println """
📊 数据生成信息:
   当前配置: 使用 Fabric 数据生成器为双平台生成数据
   数据位置: ../common/src/generated/resources
   
💡 使用方法:
   ./gradlew generateData     # 运行 Fabric 数据生成
   ./gradlew fabric:generateData  # 同上
   
📝 注意:
   NeoForge 数据生成已禁用
   所有平台共享 Fabric 生成的数据
   Mixin 配置统一放在 Common 模块
        """
    }
}