plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.115'
    id 'idea'
}

version = mod_version
group = maven_group

base {
    archivesName = "${rootProject.archives_name}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// 清理任务
tasks.register('cleanModDevCache', Delete) {
    delete 'build/moddev'
}

tasks.register('cleanGeneratedData', Delete) {
    delete 'src/generated/resources'

    doLast {
        println "✅ 已清理 NeoForge 生成的数据"
    }
}

// 运行任务配置
tasks.withType(JavaExec).configureEach {
    it.dependsOn('cleanModDevCache')
}

// NeoForge 配置
neoForge {
    version = rootProject.neo_version

    parchment {
        mappingsVersion = rootProject.parchment_mappings_version
        minecraftVersion = rootProject.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
            programArgument '--username=Dev'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
        }

        // 数据生成配置
        data {
            data()
            programArguments.addAll '--mod', "${mod_id}", '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
            systemProperty 'neoforge.datagen', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(":common")
}

// 源集配置
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// 模组元数据生成
tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version: rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neo_version: rootProject.neo_version,
            loader_version_range: rootProject.loader_version_range,
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_license: rootProject.mod_license,
            mod_version: rootProject.mod_version,
            mod_authors: rootProject.mod_authors,
            mod_description: rootProject.mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir tasks.generateModMetadata
neoForge.ideSyncTask tasks.generateModMetadata

// 资源处理
processResources {
    // 可以在这里添加资源过滤或处理逻辑
}

// 编译配置
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.named('compileJava') {
    dependsOn(':common:compileJava')
}

// === 数据生成验证 ===

tasks.register('verifyDataGeneration') {
    group = 'verification'
    description = 'Verifies that data generation completed successfully'

    doLast {
        def generatedDir = file('src/generated/resources')
        if (generatedDir.exists()) {
            def files = []
            generatedDir.eachFileReclect { file -> if (file.isFile()) files << file }

            println "✅ NeoForge 数据生成验证"
            println "📊 生成文件数: ${files.size()}"

            if (files.size() > 0) {
                println "📄 生成的文件类型:"
                def fileTypes = files.collect { it.name.substring(it.name.lastIndexOf('.') + 1) }.unique()
                fileTypes.each { type ->
                    def count = files.count { it.name.endsWith(".${type}") }
                    println "   ${type.toUpperCase()}: ${count} 个"
                }

                // 显示目录结构
                println "📁 目录结构:"
                generatedDir.eachDir { dir ->
                    println "   📂 ${dir.name}/"
                    dir.eachFile { file ->
                        if (file.isFile()) {
                            println "     📄 ${file.name}"
                        }
                    }
                }
            }
        } else {
            println "❌ NeoForge 数据生成失败: 输出目录不存在"
        }
    }
}

// 数据生成后执行验证
tasks.named('runData') {
    finalizedBy 'verifyDataGeneration'

    doFirst {
        println "♻️ 开始 NeoForge 数据生成..."
    }

    doLast {
        println "✅ NeoForge 数据生成任务完成"
    }
}

// 清理任务
tasks.named('clean') {
    dependsOn 'cleanGeneratedData', 'cleanModDevCache'
}

// 发布配置
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java

            pom {
                name = "${rootProject.mod_name} (NeoForge)"
                description = rootProject.mod_description
            }
        }
    }
}

// IDE 配置
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
        generatedSourceDirs += file('src/generated/resources')
    }
}